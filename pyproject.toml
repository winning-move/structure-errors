[project]
name = "np-registered"
version = "1.0.0"
description = "Registered study: organizational structure and the errors of generation and evaluation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.100",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/np_registered"]

[tool.pytest.ini_options]
testpaths = ["tests"]
